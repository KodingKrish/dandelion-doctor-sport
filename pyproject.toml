[project]
name = "dandelion-doctor"
version = "2.0.0"
description = "Deterministic diagnostic/repair toolkit for Xiaomi Redmi 9A Sport (M2006C3LI / dandelion)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyusb>=1.2",
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
tui = ["textual>=0.80"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[project.scripts]
dandelion-doctor = "dandelion_doctor.ui.cli:app"
dandelion-doctor-tui = "dandelion_doctor.ui.tui:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
